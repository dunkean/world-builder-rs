[workspace]
members = ["crates/world-core", "crates/world-contracts", "crates/world-human", "crates/world-app", "crates/world-viewer", "crates/world-erosion"]
default-members = ["crates/world-core", "crates/world-contracts", "crates/world-human", "crates/world-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
